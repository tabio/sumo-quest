name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint / 型検査 / テスト / ビルド / E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # 事前ビルドした out/ を、配信時と同じ basePath の下に置いて配信する。
      # 配置は scripts/serve-e2e.mjs が行う。経緯は ADR-0005 を参照。
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
