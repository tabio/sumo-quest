name: Deploy to GitHub Pages

# mainへのpushで自動配信する。
# workflow_dispatch は、コード変更を伴わない再配信のために残している。
on:
  push:
    branches: [main]
  workflow_dispatch:

# basePath は GITHUB_ACTIONS と GITHUB_REPOSITORY から導出される。
# 詳細は config/basePath.mjs を参照。
permissions:
  contents: read
  pages: write
  id-token: write

# 実行中の配信は中断せず、後続をまとめて1本にする。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: 配信
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
